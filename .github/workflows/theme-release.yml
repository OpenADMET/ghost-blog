name: Theme release

on:
  push:
    tags: ["openadmet-theme-v*"]

permissions:
  contents: write

defaults:
  run:
    working-directory: content/themes/openadmet-theme

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GHOST_ADMIN_API_URL: ${{ vars.GHOST_ADMIN_API_URL }}
      GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: content/themes/openadmet-theme/package-lock.json

      - name: Check tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "openadmet-theme-v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::No CHANGELOG.md entry found for $VERSION"
            exit 1
          fi
          printf '\nUpload `openadmet-theme.zip` in Ghost Admin → Settings → Design → Theme.\n' >> "$RUNNER_TEMP/notes.md"

      - run: npm ci

      - name: Validate theme with gscan
        run: npx gscan --fatal --verbose .

      - name: Build zip
        run: npx gulp zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/openadmet-theme.zip \
            --title "openadmet-theme $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      # Runs only once GHOST_ADMIN_API_URL (repo variable) and
      # GHOST_ADMIN_API_KEY (repo secret) are configured.
      - name: Deploy theme to Ghost
        if: env.GHOST_ADMIN_API_URL != '' && env.GHOST_ADMIN_API_KEY != ''
        uses: TryGhost/action-deploy-theme@v2
        with:
          api-url: ${{ env.GHOST_ADMIN_API_URL }}
          api-key: ${{ env.GHOST_ADMIN_API_KEY }}
          file: content/themes/openadmet-theme/dist/openadmet-theme.zip
